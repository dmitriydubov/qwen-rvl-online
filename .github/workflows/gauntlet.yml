# Gauntlet gate for pull requests. Installed to .github/workflows/gauntlet.yml by gauntlet/install.sh.
# start records project.* and gate.java.*; CI runs every guarded build's application on ITS project Java and the
# tools on ITS gate Java (gauntlet/config/<module>/gauntlet.properties overlays the common file, as in Gradle).
# The agent's hooks run only inside Claude Code; this job is the check nobody can skip.
name: gauntlet

on:
  pull_request:
    paths:                                  # documents never change what the gates check; CI minutes are metered
      - '**'
      - '!docs/**'
      - '!project_files/**'
      - '!**.md'
      # except files the tests read (acceptance.inputs and test.inputs of the modules): listed by name, so no exclusion
      # above, today's or a later one, makes CI skip a change to them
      - 'contract-service/docs/operations.md'
      - 'data-reference/docs/openapi.yaml'
  workflow_dispatch:

concurrency:
  group: gauntlet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gauntlet:
    name: gauntlet
    runs-on: ubuntu-24.04                   # pinned: ubuntu-latest moves to Ubuntu 26 from 2026-10-19
    timeout-minutes: 360                    # sequential gherkinMutantsRun with cN/zN controls across ~50 features can run 3-4h
    env:
      ORG_GRADLE_PROJECT_publicRepositories: "true"   # outside the corporate network: public repositories
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0                      # scope=changed needs the merge base with the base branch

      - name: Resolve the guarded builds and their Java versions
        id: plan
        run: |
          props=gauntlet/config/gauntlet.properties
          # Where a key ends for java.util.Properties, which reads these files in gauntlet.gradle: `=`, `:` or blanks.
          assigns() { printf '^[[:space:]]*%s([[:space:]]*[=:][[:space:]]*|[[:space:]]+|$)' "$1"; }
          # The last assignment of a key in a properties file; surrounding whitespace and a CR are not the value.
          value() {
            [ -f "$2" ] || return 0
            sed -En "/$(assigns "$1")/{s###;h;}; \${x;p;}" "$2" | tr -d '\r' | sed 's#[[:space:]]*$##'
          }
          # A key the module's overlay assigns (even to nothing) wins over the common file, as in gauntlet.gradle.
          setting() {
            overlay="gauntlet/config/$2/gauntlet.properties"
            if [ "$2" != . ] && [ -f "$overlay" ] && grep -Eq "$(assigns "$1")" "$overlay"; then
              value "$1" "$overlay"
            else
              value "$1" "$props"
            fi
          }
          # setup-java keeps ONE JDK per major version (JAVA_HOME_<major>_<ARCH>): a second version of the same major
          # would silently replace the first one in every build. So the plan lets a major be written one way only.
          # $1 = the setting, $2 = its build, $3 = the version as written; leaves the version setup-java gets in $spec.
          jdks=()
          asked=()
          one_version='^[0-9][^[:space:]|]*$'
          need_jdk() {
            spec=${3#1.}                          # 1.8 is Java 8: setup-java takes only the new notation
            if ! [[ $spec =~ $one_version ]]; then
              echo "::error::$1 '$3' for '$2' is not one Java version: write a version that starts with its major - 17, 17.0.2, 17-ea (1.8 is read as 8) - not a range"
              exit 1
            fi
            for i in "${!jdks[@]}"; do
              [ "${jdks[$i]}" != "$spec" ] || return 0
              if [ "${jdks[$i]%%[!0-9]*}" = "${spec%%[!0-9]*}" ]; then
                echo "::error::Java ${spec%%[!0-9]*} is asked for as '${jdks[$i]}' (${asked[$i]}) and as '$spec' ($1 for '$2'): setup-java keeps one JDK per major version, so write Java ${spec%%[!0-9]*} one way in every project.java.version and gate.java.version"
                exit 1
              fi
            done
            jdks+=("$spec")
            asked+=("$1 for '$2'")
          }
          # module is a comma-separated list of directories: an entry is trimmed and loses its slashes, as in the hooks.
          builds=()
          while IFS= read -r dir; do
            builds+=("$dir")
          done < <(value module "$props" | tr ',' '\n' | sed 's#^[[:space:]]*##; s#[[:space:]]*$##; s#^/*##; s#/*$##; /^$/d')
          [ "${#builds[@]}" -gt 0 ] || builds=(.)
          plan="$RUNNER_TEMP/gauntlet-plan"
          : > "$plan"
          for dir in "${builds[@]}"; do
            project=$(setting 'project\.java\.version' "$dir")
            gate=$(setting 'gate\.java\.version' "$dir")
            if [ -z "$project" ]; then
              echo "::error::Set project.java.version for '$dir' in gauntlet/config/gauntlet.properties (or the module's overlay)"
              exit 1
            fi
            gate=${gate:-$project}
            need_jdk project.java.version "$dir" "$project"
            project=$spec
            need_jdk gate.java.version "$dir" "$gate"
            printf '%s\t%s\t%s\n' "$dir" "$project" "$spec" >> "$plan"
          done
          cat "$plan"
          {
            echo 'java<<GAUNTLET_EOF'
            printf '%s\n' "${jdks[@]}"
            echo 'GAUNTLET_EOF'
          } >> "$GITHUB_OUTPUT"

      # Every JDK any guarded build needs, in one step: setup-java exports JAVA_HOME_<major>_<ARCH> for each of
      # them (and puts the last one first on PATH - the run step below sets JAVA_HOME and PATH per build itself).
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ steps.plan.outputs.java }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve the base branch
        id: base
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          base="$BASE_REF"
          if [ -z "$base" ]; then
            # the key ends where it ends for java.util.Properties in gauntlet.gradle: at `=`, `:` or blanks
            base=$(sed -En 's#^[[:space:]]*baseRef([[:space:]]*[=:][[:space:]]*|[[:space:]]+)origin/##p' gauntlet/config/gauntlet.properties | tail -1 | tr -d '\r' | sed 's#[[:space:]]*$##')
          fi
          echo "ref=origin/${base:-main}" >> "$GITHUB_OUTPUT"
          git fetch --no-tags origin "${base:-main}"
          # Only the modules the PR touches run; a change to the kit or the workflow itself runs all of them.
          changed=$(git diff --name-only "origin/${base:-main}...HEAD")
          if [ -n "$changed" ] && ! echo "$changed" | grep -qE '^(gauntlet/|\.github/)'; then
            filtered=$(mktemp "${RUNNER_TEMP:-/tmp}/gauntlet-plan.XXXXXX")
            while IFS=$'\t' read -r dir project gate; do
              if [ "$dir" = . ] || echo "$changed" | grep -q "^$dir/"; then
                printf '%s\t%s\t%s\n' "$dir" "$project" "$gate" >> "$filtered"
              fi
            done < "$RUNNER_TEMP/gauntlet-plan"
            [ -s "$filtered" ] && mv "$filtered" "$RUNNER_TEMP/gauntlet-plan" || rm -f "$filtered"
          fi
          echo "gauntlet runs in:"
          cat "$RUNNER_TEMP/gauntlet-plan"

      - name: Run the gauntlet in every guarded build
        env:
          GAUNTLET_BASE_REF: ${{ steps.base.outputs.ref }}
        run: |
          # The JDK setup-java installed for a version, JAVA_HOME_<major>_<ARCH>: the plan step left one version per
          # major and each of them begins with its major. Fails when there is none.
          jdk() {
            var=$(compgen -v "JAVA_HOME_${1%%[!0-9]*}_" | head -1)
            [ -n "$var" ] && [ -x "${!var}/bin/java" ] && printf '%s' "${!var}"
          }
          status=0
          ran=0
          # Gradle's exit code alone believes a build that left the gates out of its task graph (a build script that
          # adds them to gradle.startParameter.excludedTaskNames, a build that no longer applies the kit): the output
          # must name every gate task of `gauntlet` as run - the Stop hook's judgement, gauntlet/hooks/stop_gate.py.
          verify="$PWD/gauntlet/hooks/stop_gate.py"
          # fd 3: Gradle must not read the plan from stdin and swallow the remaining builds
          while IFS=$'\t' read -r dir project gate <&3; do
            ran=$((ran + 1))
            echo "::group::gauntlet in $dir (application Java $project, gate Java $gate)"
            (
              # `( ... ) || status=1` switches errexit off inside: every step that must stop the build says so
              cd -- "$dir" || { echo "::error::guarded build '$dir' (module= in gauntlet.properties) does not exist"; exit 1; }
              JAVA_HOME=$(jdk "$project") || { echo "::error::no JDK $project for '$dir'"; exit 1; }
              GAUNTLET_GATE_JAVA_HOME=$(jdk "$gate") || { echo "::error::no JDK $gate for the gates of '$dir'"; exit 1; }
              export JAVA_HOME GAUNTLET_GATE_JAVA_HOME
              export PATH="$JAVA_HOME/bin:$PATH"   # a task that runs plain `java` gets the application JVM too
              ./gradlew --version </dev/null && ./gradlew gauntletInfo </dev/null || exit 1
              output=$(mktemp "${RUNNER_TEMP:-/tmp}/gauntlet-output.XXXXXX")
              ./gradlew gauntlet --continue --console=plain -Pgauntlet.baseRef="$GAUNTLET_BASE_REF" </dev/null | tee "$output"
              [ "${PIPESTATUS[0]}" -eq 0 ] || exit 1
              python3 "$verify" --verify-ran gauntlet --log "$output" ||
                { echo "::error::gauntlet in '$dir': Gradle did not run every gate task (the line above names them)"; exit 1; }
            ) || status=1
            echo "::endgroup::"
          done 3< "$RUNNER_TEMP/gauntlet-plan"
          if [ "$ran" -eq 0 ]; then
            echo "::error::no guarded build ran"
            status=1
          fi
          exit $status

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gauntlet-reports
          path: |
            **/build/reports
            **/build/gauntlet
          if-no-files-found: ignore
